<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verify Email — Campus Services Portal</title>
<meta name="description" content="Verify your email address to activate your Campus Services Portal account."/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="page-bg"></div>

<div class="flex-center" style="min-height:100vh;padding:2rem;">
  <div style="max-width:480px;width:100%;">

    <div class="text-center" style="margin-bottom:2rem;">
      <div style="width:64px;height:64px;background:linear-gradient(135deg,var(--primary),var(--purple));
                  border-radius:18px;display:flex;align-items:center;justify-content:center;
                  font-size:1.75rem;margin:0 auto 1rem;box-shadow:0 0 32px rgba(99,102,241,0.4);">
        ✉
      </div>
      <h1 style="font-size:1.6rem;font-weight:700;">Email Verification</h1>
      <p style="color:var(--text-secondary);margin-top:0.5rem;">Activating your Campus Services Portal account</p>
    </div>

    <div class="card">
      <!-- Auto-verify result injected here -->
      <div id="verify-status" style="min-height:80px;">
        <div class="flex-center" style="gap:1rem;padding:1.5rem 0;">
          <div class="spinner"></div>
          <span style="color:var(--text-secondary);">Verifying your email…</span>
        </div>
      </div>

      <div style="text-align:center;margin-top:1.5rem;">
        <a href="/login.html" class="btn btn-ghost btn-sm">← Back to Login</a>
      </div>
    </div>

    <!-- Resend Section (shown on failure) -->
    <div id="resend-section" style="display:none;margin-top:1.5rem;">
      <div class="card">
        <h2 style="font-size:1rem;font-weight:600;margin-bottom:0.5rem;">Request a New Verification Link</h2>
        <p style="color:var(--text-secondary);font-size:0.875rem;margin-bottom:1.25rem;">
          Enter your registered email address to receive a new 24-hour verification link.
        </p>

        <div id="resend-alert" class="alert global-alert" role="alert"></div>

        <form id="resend-form" novalidate>
          <div class="form-group">
            <label for="resend-email">Email Address</label>
            <div class="input-wrapper has-icon">
              <input id="resend-email" type="email" placeholder="your.email@university.edu" required/>
              <span class="input-icon">✉</span>
            </div>
            <div class="field-error"></div>
          </div>
          <button type="submit" id="resend-btn" class="btn btn-primary btn-full">
            <div class="btn-spinner"></div>
            <span class="btn-label">Resend Verification Email</span>
          </button>
        </form>
      </div>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
