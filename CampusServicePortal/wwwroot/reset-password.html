<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — Campus Services Portal</title>
<meta name="description" content="Set a new password for your Campus Services Portal account."/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="page-bg"></div>

<div class="flex-center" style="min-height:100vh;padding:2rem;">
  <div style="max-width:420px;width:100%;">

    <div class="text-center" style="margin-bottom:2rem;">
      <div style="width:64px;height:64px;background:linear-gradient(135deg,#ef4444,#b91c1c);
                  border-radius:18px;display:flex;align-items:center;justify-content:center;
                  font-size:1.75rem;margin:0 auto 1rem;box-shadow:0 0 32px rgba(239,68,68,0.35);">
        🔐
      </div>
      <h1 style="font-size:1.6rem;font-weight:700;">Set New Password</h1>
      <p style="color:var(--text-secondary);margin-top:0.5rem;font-size:0.9rem;">
        Choose a strong password — minimum 8 characters.
      </p>
    </div>

    <div class="card">
      <div id="reset-alert" class="alert global-alert" role="alert"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <div class="input-wrapper has-icon">
            <input id="new-password" type="password" placeholder="At least 8 characters"
                   autocomplete="new-password" required/>
            <span class="input-icon">🔒</span>
          </div>
          <div class="password-strength" style="margin-top:0.5rem;">
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <div class="strength-text" id="strength-text"></div>
          </div>
          <div class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <div class="input-wrapper has-icon">
            <input id="confirm-password" type="password" placeholder="Re-enter new password"
                   autocomplete="new-password" required/>
            <span class="input-icon">🔒</span>
          </div>
          <div class="field-error"></div>
        </div>

        <div class="alert alert-warning" style="margin-bottom:1rem;">
          <span class="alert-icon">⚠️</span>
          <span style="font-size:0.82rem;">
            Resetting your password will sign you out of all other sessions.
          </span>
        </div>

        <button type="submit" id="reset-btn" class="btn btn-danger btn-full btn-lg">
          <div class="btn-spinner"></div>
          <span class="btn-label">Reset Password</span>
        </button>
      </form>
    </div>

    <div class="text-center" style="margin-top:1.5rem;">
      <a href="/login.html" class="text-link" style="font-size:0.875rem;">← Back to Login</a>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
