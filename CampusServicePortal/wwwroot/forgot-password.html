<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgot Password — Campus Services Portal</title>
<meta name="description" content="Request a password reset link for your Campus Services Portal account."/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="page-bg"></div>

<div class="flex-center" style="min-height:100vh;padding:2rem;">
  <div style="max-width:420px;width:100%;">

    <div class="text-center" style="margin-bottom:2rem;">
      <div style="width:64px;height:64px;background:linear-gradient(135deg,#f59e0b,#d97706);
                  border-radius:18px;display:flex;align-items:center;justify-content:center;
                  font-size:1.75rem;margin:0 auto 1rem;box-shadow:0 0 32px rgba(245,158,11,0.35);">
        🔑
      </div>
      <h1 style="font-size:1.6rem;font-weight:700;">Forgot Password?</h1>
      <p style="color:var(--text-secondary);margin-top:0.5rem;font-size:0.9rem;">
        No worries — enter your email and we'll send a reset link.
      </p>
    </div>

    <div class="card">
      <div id="forgot-alert" class="alert global-alert" role="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="forgot-email">Email Address</label>
          <div class="input-wrapper has-icon">
            <input id="forgot-email" type="email" placeholder="your.email@university.edu"
                   autocomplete="email" required/>
            <span class="input-icon">✉</span>
          </div>
          <div class="field-error"></div>
        </div>

        <button type="submit" id="forgot-btn" class="btn btn-primary btn-full btn-lg">
          <div class="btn-spinner"></div>
          <span class="btn-label">Send Reset Link</span>
        </button>
      </form>

      <div class="alert alert-info" style="margin-top:1.25rem;">
        <span class="alert-icon">🛡</span>
        <span style="font-size:0.82rem;">
          For security, we never confirm whether an email address is registered.
          You'll always receive a consistent response.
        </span>
      </div>
    </div>

    <div class="text-center" style="margin-top:1.5rem;">
      <a href="/login.html" class="text-link" style="font-size:0.875rem;">← Back to Login</a>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
