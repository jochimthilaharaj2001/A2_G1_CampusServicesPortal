<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lab Reservations — Campus Services Portal</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
  .tabs { display: flex; gap: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
  .tab-btn { padding: 0.75rem 1.5rem; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); cursor: pointer; font-weight: 500; font-size: 1rem; transition: all 0.2s; }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; animation: fadeIn 0.3s ease; }
  
  .lab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
  .lab-card { cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 2px solid transparent; }
  .lab-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .lab-card.selected { border-color: var(--primary); background: rgba(99, 102, 241, 0.08); }
  .lab-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .lab-title { font-size: 1.1rem; font-weight: 600; margin: 0; }
  .lab-type-badge { font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 999px; font-weight: 600; }
  .type-Computer { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
  .type-Science { background: rgba(16, 185, 129, 0.15); color: #34d399; }
  
  .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; }
  .slot-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 0.75rem; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s; text-align: center; }
  .slot-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
  .slot-btn.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
  .slot-btn:disabled { opacity: 0.5; cursor: not-allowed; background: rgba(255,255,255,0.02); text-decoration: line-through; }
  
  .seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
  .seat-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 0.75rem; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; transition: all 0.2s; }
  .seat-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--bg-card-hover); }
  .seat-btn.selected { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
  .seat-btn:disabled { opacity: 0.4; cursor: not-allowed; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); }
  
  .reservation-item { display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 1rem; background: var(--bg-card); }
  @media(min-width: 640px) {
    .reservation-item { flex-direction: row; justify-content: space-between; align-items: center; }
  }
  .res-info h3 { margin: 0 0 0.25rem 0; font-size: 1.1rem; }
  .res-meta { display: flex; flex-wrap: wrap; gap: 1rem; color: var(--text-secondary); font-size: 0.875rem; }
  .status-badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .status-Approved { background: rgba(16, 185, 129, 0.15); color: #34d399; }
  .status-Cancelled { background: rgba(239, 68, 68, 0.15); color: #f87171; }
  .status-Pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
  
  .step-container { margin-bottom: 2rem; opacity: 0.5; pointer-events: none; transition: opacity 0.3s; }
  .step-container.active { opacity: 1; pointer-events: auto; }
  .step-title { font-size: 1.25rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .step-badge { background: var(--primary); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.875rem; font-weight: bold; }
</style>
</head>
<body id="labs-page">
<div class="page-bg"></div>

<!-- Navbar -->
<nav class="navbar">
  <a href="/dashboard.html" class="nav-brand">
    <div class="nav-logo">🎓</div>
    Campus Portal
  </a>
  <div class="nav-links">
    <a href="/dashboard.html" class="nav-link">Dashboard</a>
    <a href="/labs.html" class="nav-link active">Lab Reservations</a>
  </div>
  <div class="nav-user">
    <a href="/profile.html" class="user-avatar profile-nav-avatar" id="nav-avatar" aria-label="My Profile" title="My Profile">U</a>
    <span style="font-size:0.875rem;color:var(--text-secondary);" id="nav-name">Student</span>
    <button id="logout-btn" class="btn btn-ghost btn-sm">Sign Out</button>
  </div>
</nav>

<div class="page-wrapper">
  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Lab Reservations</h1>
        <p class="page-subtitle">Book a computer seat or science lab time slot</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-target="tab-new">New Booking</button>
      <button class="tab-btn" data-target="tab-my">My Reservations</button>
    </div>

    <!-- Tab: New Booking -->
    <div id="tab-new" class="tab-pane active">
      
      <!-- Step 1: Select Lab -->
      <div class="step-container active" id="step-1">
        <h2 class="step-title"><span class="step-badge">1</span> Choose a Lab</h2>
        <div id="labs-loading" class="spinner" style="margin: 2rem auto; display: none;"></div>
        <div id="lab-list" class="lab-grid"></div>
        <p id="no-labs-msg" style="display:none; color:var(--text-secondary);">No active labs available right now.</p>
      </div>

      <!-- Step 2: Select Date & Time -->
      <div class="step-container" id="step-2">
        <h2 class="step-title"><span class="step-badge">2</span> Select Date & Time</h2>
        <div class="card">
          <div class="form-group" style="max-width: 300px; margin-bottom: 1.5rem;">
            <label for="booking-date">Date</label>
            <input type="date" id="booking-date" class="form-control" />
          </div>
          <div id="slots-loading" class="spinner" style="display: none; margin: 1rem 0;"></div>
          <div id="slot-list" class="slot-grid"></div>
          <p id="no-slots-msg" style="display:none; color:var(--text-secondary); margin-top:1rem;">No available slots for the selected date.</p>
        </div>
      </div>

      <!-- Step 3: Choose Seat & Confirm -->
      <div class="step-container" id="step-3">
        <h2 class="step-title"><span class="step-badge">3</span> Confirm Details</h2>
        <div class="card">
          <!-- Only for Computer Labs -->
          <div id="seat-selection-container" style="display: none; margin-bottom: 1.5rem;">
            <label style="font-weight: 500; display: block; margin-bottom: 0.5rem;">Select an available seat</label>
            <div id="seats-loading" class="spinner" style="display: none;"></div>
            <div id="seat-list" class="seat-grid"></div>
          </div>

          <div class="form-group">
            <label for="booking-purpose">Purpose (Optional)</label>
            <textarea id="booking-purpose" class="form-control" rows="2" placeholder="Briefly describe what you'll be working on"></textarea>
          </div>

          <div id="booking-alert" class="alert global-alert" role="alert" style="margin-bottom: 1.5rem;"></div>

          <div style="display: flex; gap: 1rem;">
            <button id="btn-reset" class="btn btn-ghost">Start Over</button>
            <button id="btn-confirm-booking" class="btn btn-primary" style="flex:1;">
              <div class="btn-spinner"></div>
              <span class="btn-label">Confirm Reservation</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab: My Reservations -->
    <div id="tab-my" class="tab-pane">
      <div class="card">
        <div id="reservations-loading" class="spinner" style="margin: 2rem auto;"></div>
        <div id="my-reservations-list"></div>
        <div id="no-reservations-msg" style="display:none; text-align:center; padding: 3rem 1rem; color: var(--text-secondary);">
          <div style="font-size: 3rem; margin-bottom: 1rem;">📅</div>
          <p>You don't have any lab reservations yet.</p>
          <button class="btn btn-primary mt-4" onclick="document.querySelector('.tab-btn[data-target=\'tab-new\']').click()">Book a Lab</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/labs.js"></script>
</body>
</html>
