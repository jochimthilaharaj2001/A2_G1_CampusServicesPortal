<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Applications</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                margin-top: 5px;
                opacity: .85;
            }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,.4);
            border-radius: 8px;
        }

        .container {
            max-width: 1300px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .add-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .message {
            display: none;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f3f4f6;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .approved {
            background: #dcfce7;
            color: #166534;
        }

        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-btn {
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 550px;
            border-radius: 14px;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel-btn {
            border: none;
            background: #e5e7eb;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        .save-btn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="header">
        <div>
            <h1>Hostel Applications</h1>
            <p>Manage student hostel applications</p>
        </div>

        <a href="/admin/index.html" class="back-btn">
            ← Admin Dashboard
        </a>
    </header>

    <main class="container">

        <div id="message" class="message"></div>

        <div class="top-bar">
            <h2>Applications</h2>

            <button class="add-btn" onclick="openAddModal()">
                + New Application
            </button>
        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Hostel</th>
                        <th>Room</th>
                        <th>Semester</th>
                        <th>Status</th>
                        <th>Requirements</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="applicationTableBody">
                    <tr>
                        <td colspan="8" class="loading">
                            Loading applications...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </main>


    <div id="applicationModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="modalTitle">New Application</h2>

                <span class="close" onclick="closeModal()">
                    &times;
                </span>
            </div>

            <form id="applicationForm">

                <div class="form-group">
                    <label for="studentIndexNumber">Student Index Number</label>

                    <input type="text"
                           id="studentIndexNumber"
                           list="studentIndexOptions"
                           maxlength="50"
                           autocomplete="off"
                           required>
                    <datalist id="studentIndexOptions"></datalist>
                </div>

                <div class="form-group">
                    <label for="hostelId">Hostel</label>

                    <select id="hostelId" required>
                        <option value="">Select Hostel</option>
                    </select>
                </div>

                <div class="form-group" id="roomGroup">
                    <label for="roomId">Room</label>

                    <select id="roomId">
                        <option value="">No Room Assigned</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="semester">Semester</label>

                    <input type="text"
                           id="semester"
                           maxlength="20"
                           placeholder="e.g. Semester 1"
                           required>
                </div>

                <div class="form-group">
                    <label for="specialRequirements">
                        Special Requirements
                    </label>

                    <textarea id="specialRequirements"
                              maxlength="255"></textarea>
                </div>

                <div class="form-group" id="statusGroup">
                    <label for="status">Status</label>

                    <select id="status">
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <div class="form-actions">

                    <button type="button"
                            class="cancel-btn"
                            onclick="closeModal()">
                        Cancel
                    </button>

                    <button type="submit"
                            class="save-btn">
                        Save Application
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="/js/api.js"></script>
    <script src="/js/applications.js"></script>

</body>
</html>
