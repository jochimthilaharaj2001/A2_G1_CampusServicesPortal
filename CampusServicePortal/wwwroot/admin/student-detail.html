<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Detail — Campus Services Portal Admin</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
  code { font-family: 'Courier New', monospace; }
</style>
</head>
<body id="admin-student-detail-page">
<div class="page-bg"></div>

<!-- Navbar -->
<nav class="navbar">
  <a href="/admin/students.html" class="nav-brand">
    <div class="nav-logo">🎓</div>
    Campus Portal
    <span class="badge badge-warning" style="margin-left:0.5rem;">Admin</span>
  </a>
  <div class="nav-links">
    <a href="/admin/index.html" class="nav-link">Dashboard</a>
    <a href="/admin/students.html" class="nav-link active">Students</a>
    <a href="/admin/master-list.html" class="nav-link">Master List</a>
    <a href="/admin/master-data.html" class="nav-link">Master Data</a>
  </div>
  <div class="nav-user">
    <div class="user-avatar" id="nav-avatar">A</div>
    <span style="font-size:0.875rem;color:var(--text-secondary);" id="nav-name">Admin</span>
    <button id="logout-btn" class="btn btn-ghost btn-sm">Sign Out</button>
  </div>
</nav>

<div class="page-wrapper">
  <div class="container" style="max-width:800px;">
    
    <div style="margin-bottom:1.5rem;">
      <a href="/admin/students.html" class="btn btn-ghost btn-sm">← Back to Directory</a>
    </div>

    <!-- Loading State -->
    <div id="loading" style="text-align:center;padding:4rem;">
      <div class="spinner" style="width:40px;height:40px;margin:0 auto 1rem;"></div>
      <p style="color:var(--text-muted);">Loading student profile…</p>
    </div>

    <!-- Content -->
    <div id="content" style="display:none;">
      
      <div class="card" style="margin-bottom:2rem;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;">
          <div style="display:flex;align-items:center;gap:1.5rem;">
            <div class="user-avatar" id="avatar" style="width:80px;height:80px;font-size:2rem;background:linear-gradient(135deg, var(--primary), var(--secondary));color:white;"></div>
            <div>
              <h1 id="name" style="margin:0;font-size:1.75rem;"></h1>
              <div style="color:var(--text-secondary);font-size:1rem;margin-top:0.25rem;" id="index"></div>
              <div style="margin-top:0.5rem;display:flex;gap:0.5rem;">
                <span id="status-badge" class="badge"></span>
                <span id="verified-badge" class="badge"></span>
              </div>
            </div>
          </div>
          <button class="btn btn-outline" id="edit-btn">✎ Edit Record</button>
        </div>

        <div id="view-mode">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;">
            <div>
              <h3 style="margin-top:0;margin-bottom:1rem;color:var(--primary);font-size:0.875rem;text-transform:uppercase;letter-spacing:1px;">Academic Details</h3>
              <div class="form-group"><label>Faculty</label><div id="view-faculty" style="font-weight:500;"></div></div>
              <div class="form-group"><label>Degree Program</label><div id="view-degree" style="font-weight:500;"></div></div>
              <div class="form-group"><label>Enrollment Year</label><div id="view-year" style="font-weight:500;"></div></div>
              <div class="form-group"><label>Deactivated At</label><div id="view-deactivated" style="font-weight:500;"></div></div>
            </div>
            <div>
              <h3 style="margin-top:0;margin-bottom:1rem;color:var(--primary);font-size:0.875rem;text-transform:uppercase;letter-spacing:1px;">Contact Details</h3>
              <div class="form-group"><label>Email Address</label><div id="view-email" style="font-weight:500;"></div></div>
              <div class="form-group"><label>Phone Number</label><div id="view-phone" style="font-weight:500;"></div></div>
              <div class="form-group"><label>Emergency Contact</label><div id="view-contact" style="font-weight:500;"></div></div>
              <div class="form-group"><label>Address</label><div id="view-address" style="font-weight:500;"></div></div>
            </div>
          </div>
        </div>

        <div id="edit-mode" style="display:none;">
          <div id="edit-alert" style="display:none;margin-bottom:1rem;"></div>
          <form id="edit-form">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
              <div class="form-group">
                <label>Full Name <span style="color:red">*</span></label>
                <input type="text" id="edit-fullname" required/>
              </div>
              <div class="form-group">
                <label>Email Address <span style="color:red">*</span></label>
                <input type="email" id="edit-email" required/>
              </div>
              <div class="form-group">
                <label>Faculty <span style="color:red">*</span></label>
                <select id="edit-faculty" required></select>
              </div>
              <div class="form-group">
                <label>Degree Program <span style="color:red">*</span></label>
                <select id="edit-degree" required></select>
              </div>
              <div class="form-group">
                <label>Enrollment Year <span style="color:red">*</span></label>
                <input type="number" id="edit-year" min="2000" max="2100" required/>
              </div>
              <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="edit-phone"/>
              </div>
              <div class="form-group">
                <label>Emergency Contact</label>
                <input type="text" id="edit-contact"/>
              </div>
              <div class="form-group">
                <label>Address</label>
                <input type="text" id="edit-address"/>
              </div>
              <div class="form-group" style="display:flex;align-items:center;gap:0.5rem;padding-top:1.5rem;">
                <input type="checkbox" id="edit-active" style="width:1.2rem;height:1.2rem;accent-color:var(--primary);"/>
                <label style="margin:0;cursor:pointer;" for="edit-active">Account is Active</label>
              </div>
              <div class="form-group" style="display:flex;align-items:center;gap:0.5rem;padding-top:1.5rem;">
                <input type="checkbox" id="edit-verified" style="width:1.2rem;height:1.2rem;accent-color:var(--primary);"/>
                <label style="margin:0;cursor:pointer;" for="edit-verified">Email is Verified</label>
              </div>
            </div>
            
            <div style="display:flex;justify-content:flex-end;gap:1rem;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border-color);">
              <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
              <button type="submit" class="btn btn-primary" id="save-btn">
                <div class="btn-spinner"></div>
                <span class="btn-label">Save Changes</span>
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin-student-detail.js"></script>
</body>
</html>
