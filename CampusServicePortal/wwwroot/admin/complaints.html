<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Complaints - Campus Portal</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="page-bg"></div>

    <nav class="navbar">

        <a href="/admin/index.html" class="nav-brand">
            <div class="nav-logo">🎓</div>
            Campus Portal
            <span class="badge badge-warning">Admin</span>
        </a>

        <div class="nav-links">
            <a href="/admin/index.html" class="nav-link">
                Dashboard
            </a>

            <a href="/admin/students.html" class="nav-link">
                Students
            </a>

            <a href="/admin/complaints.html" class="nav-link active">
                Complaints
            </a>

            <a href="/admin/fees.html" class="nav-link">
                Fees
            </a>
        </div>

        <div class="nav-user">

            <div class="user-avatar"
                 id="nav-avatar">
                A
            </div>

            <span id="nav-name">Admin</span>

            <button id="logout-btn"
                    class="btn btn-ghost btn-sm">
                Sign Out
            </button>

        </div>

    </nav>

    <main class="page-wrapper">

        <div class="container"
             style="max-width: 1200px;">

            <div class="page-header">

                <div>
                    <h1 class="page-title">
                        Complaint Management
                    </h1>

                    <p class="page-subtitle">
                        Review campus complaints and maintain available categories.
                    </p>
                </div>

                <button class="btn btn-outline"
                        id="new-category">
                    New Category
                </button>

            </div>

            <div id="admin-complaint-alert"
                 class="alert global-alert"></div>

            <section class="card"
                     style="padding: 1.5rem; margin-bottom: 1.25rem;">

                <div class="filter-bar">

                    <select id="status-filter">
                        <option value="">All statuses</option>
                        <option>Pending</option>
                        <option>In Progress</option>
                        <option>Resolved</option>
                    </select>

                </div>

                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Submitted</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="complaint-rows"></tbody>

                    </table>

                </div>

            </section>

            <section class="card"
                     style="padding: 1.5rem;">

                <h2 style="margin-top: 0;">
                    Complaint Categories
                </h2>

                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="category-rows"></tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>

    <div class="modal-overlay"
         id="category-modal">

        <div class="modal">

            <h2 class="modal-title"
                id="category-title">
                Complaint Category
            </h2>

            <form id="category-form">

                <input type="hidden"
                       id="category-id">

                <div class="form-group">

                    <label>Name</label>

                    <input id="category-name"
                           required
                           maxlength="100">

                </div>

                <div class="form-group">

                    <label>Description</label>

                    <textarea id="category-description"
                              maxlength="300"></textarea>

                </div>

                <div class="modal-actions">

                    <button type="button"
                            class="btn btn-ghost"
                            onclick="AdminComplaints.closeCategory()">
                        Cancel
                    </button>

                    <button class="btn btn-primary">
                        Save
                    </button>

                </div>

            </form>

        </div>

    </div>

    <div class="modal-overlay"
         id="status-modal">

        <div class="modal">

            <h2 class="modal-title">
                Update Complaint
            </h2>

            <form id="status-form">

                <input type="hidden"
                       id="complaint-id">

                <div class="form-group">

                    <label>Status</label>

                    <select id="complaint-status">
                        <option>Pending</option>
                        <option>In Progress</option>
                        <option>Resolved</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Resolution note</label>

                    <textarea id="resolution-note"
                              maxlength="2000"></textarea>

                </div>

                <div class="modal-actions">

                    <button type="button"
                            class="btn btn-ghost"
                            onclick="AdminComplaints.closeStatus()">
                        Cancel
                    </button>

                    <button class="btn btn-primary">
                        Save Update
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="/js/api.js"></script>
    <script src="/js/admin-complaints.js"></script>

</body>

</html>
