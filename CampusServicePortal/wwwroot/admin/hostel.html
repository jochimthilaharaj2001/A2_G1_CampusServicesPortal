<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel Management - Admin Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                margin-top: 5px;
                opacity: 0.85;
            }

        .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

            .top-bar h2 {
                font-size: 24px;
            }

        .add-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

            .add-btn:hover {
                background: #4338ca;
            }

        .message {
            display: none;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f3f4f6;
            text-align: left;
            padding: 16px;
            font-size: 14px;
            color: #374151;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover td {
            background: #fafafa;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-btn {
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 13px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 550px;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

            .modal-header h2 {
                font-size: 22px;
            }

        .close {
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

            .form-group label {
                display: block;
                margin-bottom: 7px;
                font-weight: bold;
                font-size: 14px;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                width: 100%;
                padding: 11px 13px;
                border: 1px solid #d1d5db;
                border-radius: 7px;
                font-size: 14px;
                outline: none;
            }

                .form-group input:focus,
                .form-group select:focus,
                .form-group textarea:focus {
                    border-color: #4f46e5;
                }

            .form-group textarea {
                resize: vertical;
                min-height: 80px;
            }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .checkbox-group input {
                width: auto;
            }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        .save-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .header {
                padding: 20px;
            }

                .header h1 {
                    font-size: 22px;
                }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .add-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div>
            <h1>Hostel Management</h1>
            <p>Manage university hostels</p>
        </div>

        <a href="index.html" class="back-btn">
            ← Back to Admin
        </a>
    </header>

    <main class="container">

        <div id="message" class="message"></div>

        <div class="top-bar">
            <h2>Hostels</h2>

            <div style="display:flex; gap:10px; align-items:center;">

                <a href="/admin/rooms.html"
                   class="add-btn"
                   style="text-decoration:none;">
                    🛏️ Manage Rooms
                </a>

                <button class="add-btn"
                        onclick="openAddModal()">
                    + Add Hostel
                </button>

            </div>
        </div>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hostel Name</th>
                        <th>Gender</th>
                        <th>Location</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="hostelTableBody">
                    <tr>
                        <td colspan="7" class="loading">
                            Loading hostels...
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </main>

    <!-- Add/Edit Modal -->

    <div id="hostelModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="modalTitle">Add Hostel</h2>

                <span class="close" onclick="closeModal()">
                    &times;
                </span>
            </div>

            <form id="hostelForm">

                <input type="hidden" id="hostelId">

                <div class="form-group">
                    <label for="hostelName">Hostel Name</label>

                    <input type="text"
                           id="hostelName"
                           maxlength="100"
                           required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Mixed">Mixed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>

                    <input type="text"
                           id="location"
                           maxlength="100"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>

                    <textarea id="description"
                              maxlength="255"></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox"
                           id="isActive"
                           checked>

                    <label for="isActive">
                        Active Hostel
                    </label>
                </div>

                <div class="form-actions">

                    <button type="button"
                            class="cancel-btn"
                            onclick="closeModal()">
                        Cancel
                    </button>

                    <button type="submit"
                            class="save-btn">
                        Save Hostel
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="../js/hostel.js"></script>

</body>
</html>
