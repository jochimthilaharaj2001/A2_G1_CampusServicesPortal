<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Management - Admin Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                margin-top: 5px;
                opacity: 0.85;
            }

        .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

            .top-bar h2 {
                font-size: 24px;
            }

        .add-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

            .add-btn:hover {
                background: #4338ca;
            }

        .message {
            display: none;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f3f4f6;
            text-align: left;
            padding: 16px;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover td {
            background: #fafafa;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .occupancy {
            font-weight: bold;
        }

        .full {
            color: #dc2626;
        }

        .available {
            color: #16a34a;
        }

        .action-btn {
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 13px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 550px;
            border-radius: 14px;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

            .form-group label {
                display: block;
                margin-bottom: 7px;
                font-weight: bold;
                font-size: 14px;
            }

            .form-group input,
            .form-group select {
                width: 100%;
                padding: 11px 13px;
                border: 1px solid #d1d5db;
                border-radius: 7px;
                font-size: 14px;
            }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .checkbox-group input {
                width: auto;
            }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        .save-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .header {
                padding: 20px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .add-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <div>
            <h1>Room Management</h1>
            <p>Manage hostel rooms and occupancy</p>
        </div>

        <a href="/admin/hostel.html" class="back-btn">
            ← Hostels
        </a>

    </header>

    <main class="container">

        <div id="message" class="message"></div>

        <div class="top-bar">

            <h2>Rooms</h2>

            <button class="add-btn"
                    onclick="openAddModal()">
                + Add Room
            </button>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Hostel</th>
                        <th>Room Number</th>
                        <th>Capacity</th>
                        <th>Occupancy</th>
                        <th>Room Type</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="roomTableBody">

                    <tr>
                        <td colspan="8" class="loading">
                            Loading rooms...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <!-- Modal -->

    <div id="roomModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Room
                </h2>

                <span class="close"
                      onclick="closeModal()">
                    &times;
                </span>

            </div>


            <form id="roomForm">

                <input type="hidden"
                       id="roomId">


                <div class="form-group">

                    <label for="hostelId">
                        Hostel
                    </label>

                    <select id="hostelId"
                            required>
                        <option value="">
                            Select Hostel
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="roomNumber">
                        Room Number
                    </label>

                    <input type="text"
                           id="roomNumber"
                           maxlength="20"
                           required>

                </div>


                <div class="form-group">

                    <label for="capacity">
                        Capacity
                    </label>

                    <input type="number"
                           id="capacity"
                           min="1"
                           max="20"
                           required>

                </div>


                <div class="form-group"
                     id="occupancyGroup"
                     style="display:none;">

                    <label for="currentOccupancy">
                        Current Occupancy
                    </label>

                    <input type="number"
                           id="currentOccupancy"
                           min="0"
                           value="0">

                </div>


                <div class="form-group">

                    <label for="roomType">
                        Room Type
                    </label>

                    <input type="text"
                           id="roomType"
                           maxlength="30"
                           placeholder="e.g. Single, Double, Shared">

                </div>


                <div class="form-group checkbox-group">

                    <input type="checkbox"
                           id="isActive"
                           checked>

                    <label for="isActive">
                        Active Room
                    </label>

                </div>


                <div class="form-actions">

                    <button type="button"
                            class="cancel-btn"
                            onclick="closeModal()">
                        Cancel
                    </button>

                    <button type="submit"
                            class="save-btn">
                        Save Room
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="/js/rooms.js"></script>

</body>
</html>
