<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Requests - Campus Portal</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="page-bg"></div>

    <nav class="navbar">
        <a href="/admin/index.html" class="nav-brand">
            <div class="nav-logo">🎓</div>
            Campus Portal
            <span class="badge badge-warning">Admin</span>
        </a>

        <div class="nav-links"></div>

        <div class="nav-user">
            <div class="user-avatar"
                 id="nav-avatar">
                A
            </div>

            <span id="nav-name">Admin</span>

            <button id="logout-btn"
                    class="btn btn-ghost btn-sm">
                Sign Out
            </button>
        </div>
    </nav>

    <main class="page-wrapper">
        <div class="container"
             style="max-width: 1200px;">

            <div class="page-header">
                <div>
                    <h1 class="page-title">
                        Certificate Requests
                    </h1>

                    <p class="page-subtitle">
                        Review student certificate requests and update the collection status.
                    </p>
                </div>
            </div>

            <div id="admin-certificate-alert"
                 class="alert global-alert"></div>

            <section class="card dashboard-panel">

                <div class="filter-bar">
                    <select id="certificate-status">
                        <option value="">All statuses</option>
                        <option>Pending</option>
                        <option>Approved</option>
                        <option>Rejected</option>
                        <option>Ready for Collection</option>
                    </select>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Certificate</th>
                                <th>Reason</th>
                                <th>Requested</th>
                                <th>Status</th>
                                <th>Note</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="certificate-rows"></tbody>
                    </table>
                </div>

            </section>

        </div>
    </main>

    <div class="modal-overlay"
         id="status-modal">
        <div class="modal">

            <h2 class="modal-title">
                Update request
            </h2>

            <form id="status-form">

                <input type="hidden"
                       id="request-id">

                <div class="form-group">
                    <label>Status</label>

                    <select id="request-status">
                        <option>Pending</option>
                        <option>Approved</option>
                        <option>Rejected</option>
                        <option>Ready for Collection</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Administrator note</label>

                    <textarea id="request-note"
                              maxlength="1000"
                              placeholder="Optional note for the student"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button"
                            class="btn btn-ghost"
                            onclick="AdminCertificates.close()">
                        Cancel
                    </button>

                    <button class="btn btn-primary">
                        Update
                    </button>
                </div>

            </form>

        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/admin-certificates.js"></script>

</body>

</html>
