<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Fees - Campus Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-bg"></div>
  <nav class="navbar">
    <a href="/admin/index.html" class="nav-brand"><div class="nav-logo">🎓</div>Campus Portal <span class="badge badge-warning">Admin</span></a>
    <div class="nav-links"><a href="/admin/index.html" class="nav-link">Dashboard</a><a href="/admin/students.html" class="nav-link">Students</a><a href="/admin/complaints.html" class="nav-link">Complaints</a><a href="/admin/fees.html" class="nav-link active">Fees</a></div>
    <div class="nav-user"><div class="user-avatar" id="nav-avatar">A</div><span id="nav-name">Admin</span><button id="logout-btn" class="btn btn-ghost btn-sm">Sign Out</button></div>
  </nav>
  <main class="page-wrapper"><div class="container" style="max-width:1200px">
    <div class="page-header"><div><h1 class="page-title">Fee Management</h1><p class="page-subtitle">Create fee types, assign charges and follow collection progress.</p></div><div style="display:flex;gap:.75rem"><button class="btn btn-outline" id="new-type">Fee Type</button><button class="btn btn-primary" id="assign-fee">Assign Fee</button></div></div>
    <div id="admin-fee-alert" class="alert global-alert"></div>
    <section class="card" style="padding:1.5rem"><div class="filter-bar"><select id="fee-status-filter"><option value="">All statuses</option><option>Outstanding</option><option>Paid</option><option>Cancelled</option></select><select id="fee-type-filter"><option value="">All fee types</option></select></div><div class="table-wrapper"><table><thead><tr><th>Student</th><th>Fee</th><th>Period</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody id="fee-rows"></tbody></table></div></section>
  </div></main>
  <div class="modal-overlay" id="fee-type-modal"><div class="modal"><h2 class="modal-title">Fee Type</h2><form id="fee-type-form"><input type="hidden" id="fee-type-id"><div class="form-group"><label>Name</label><input id="fee-type-name" required maxlength="100"></div><div class="form-group"><label>Description</label><textarea id="fee-type-description" maxlength="300"></textarea></div><div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="AdminFees.closeType()">Cancel</button><button class="btn btn-primary">Save</button></div></form></div></div>
  <div class="modal-overlay" id="assign-modal"><div class="modal"><h2 class="modal-title">Assign Fee</h2><form id="assign-form">
    <div class="form-group"><label>Student ID (for one student)</label><input id="assign-student" type="text" maxlength="50" placeholder="e.g. UT011690"></div>
    <div class="form-group"><label>Faculty (for bulk assignment)</label><select id="assign-faculty"><option value="">Loading faculties...</option></select></div>
    <div class="form-group"><label>Fee Type</label><select id="assign-type" required></select></div>
    <div class="form-group"><label>Billing period</label><input id="assign-period" required maxlength="100" placeholder="Semester 2 - 2026"></div>
    <div class="form-group"><label>Amount (LKR)</label><input id="assign-amount" type="number" min="0.01" step="0.01" required></div>
    <div class="form-group"><label>Notes</label><textarea id="assign-notes" maxlength="500"></textarea></div>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="AdminFees.closeAssign()">Cancel</button><button class="btn btn-primary">Assign</button></div>
  </form></div></div>
  <script src="/js/api.js"></script><script src="/js/admin-fees.js"></script>
</body>
</html>
