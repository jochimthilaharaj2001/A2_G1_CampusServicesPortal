<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Admin Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                margin-top: 5px;
                opacity: .85;
            }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,.4);
            border-radius: 8px;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .add-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .message {
            display: none;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f3f4f6;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .read {
            background: #dcfce7;
            color: #166534;
        }

        .unread {
            background: #fef3c7;
            color: #92400e;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .action-btn {
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 550px;
            border-radius: 14px;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .checkbox-group input {
                width: auto;
            }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel-btn {
            border: none;
            background: #e5e7eb;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        .save-btn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="header">

        <div>
            <h1>Notifications</h1>
            <p>Manage student notifications</p>
        </div>

        <a href="/admin/index.html" class="back-btn">
            ← Admin Dashboard
        </a>

    </header>


    <main class="container">

        <div id="message" class="message"></div>

        <div class="top-bar">

            <h2>Notifications</h2>

            <button class="add-btn"
                    onclick="openAddModal()">
                + New Notification
            </button>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Title</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="notificationTableBody">

                    <tr>
                        <td colspan="7" class="loading">
                            Loading notifications...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <!-- Modal -->

    <div id="notificationModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    New Notification
                </h2>

                <span class="close"
                      onclick="closeModal()">
                    &times;
                </span>

            </div>


            <form id="notificationForm">

                <div class="form-group"
                     id="studentGroup">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input type="number"
                           id="studentId"
                           min="1"
                           required>

                </div>


                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input type="text"
                           id="title"
                           maxlength="100"
                           required>

                </div>


                <div class="form-group">

                    <label for="notificationMessage">
                        Message
                    </label>

                    <textarea id="notificationMessage"
                              maxlength="255"
                              required>
                </textarea>

                </div>


                <div class="form-group checkbox-group"
                     id="readGroup"
                     style="display:none;">

                    <input type="checkbox"
                           id="isRead">

                    <label for="isRead">
                        Mark as read
                    </label>

                </div>


                <div class="form-actions">

                    <button type="button"
                            class="cancel-btn"
                            onclick="closeModal()">
                        Cancel
                    </button>

                    <button type="submit"
                            class="save-btn">
                        Save Notification
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="/js/api.js"></script>
    <script src="/js/notifications.js"></script>

</body>
</html>
