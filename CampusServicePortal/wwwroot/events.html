<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Events - Campus Portal</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="page-bg"></div>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <a href="/dashboard.html" class="nav-brand">
            <div class="nav-logo">🎓</div>
            Campus Portal
        </a>

        <div class="nav-links"></div>

        <div class="nav-user">

            <a href="/profile.html"
               class="user-avatar profile-nav-avatar"
               id="nav-avatar">
                U
            </a>

            <span id="nav-name">
                Student
            </span>

            <button id="logout-btn" class="btn btn-ghost btn-sm">
                Sign Out
            </button>

        </div>

    </nav>

    <!-- Main Content -->
    <main class="page-wrapper">

        <div class="container" style="max-width: 1200px;">

            <!-- Page Header -->
            <div class="page-header">

                <div>

                    <h1 class="page-title">
                        Campus Events
                    </h1>

                    <p class="page-subtitle">
                        Discover upcoming events and reserve your place.
                    </p>

                </div>

            </div>

            <!-- Alert -->
            <div id="event-alert" class="alert global-alert"></div>

            <!-- Upcoming Events -->
            <section>

                <h2 style="margin-bottom: 1rem;">
                    Upcoming events
                </h2>

                <div class="stats-grid"
                     id="event-list">
                </div>

            </section>

            <!-- My Registrations -->
            <section class="card dashboard-panel"
                     style="margin-top: 2rem;">

                <div class="dashboard-panel-heading">

                    <div>

                        <h2>
                            My registrations
                        </h2>

                        <p>
                            Your confirmed event registrations.
                        </p>

                    </div>

                </div>

                <!-- Registration Table -->
                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>
                                <th>Event</th>
                                <th>Venue</th>
                                <th>Date &amp; time</th>
                                <th>Seat</th>
                                <th>Status</th>
                                <th></th>
                            </tr>

                        </thead>

                        <tbody id="registration-list">
                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>

    <!-- Seat Selection Modal -->
    <div class="modal-overlay"
         id="seat-modal">

        <div class="modal">

            <h2 class="modal-title">
                Choose your seat
            </h2>

            <p id="seat-event-name"
               class="page-subtitle">
            </p>

            <form id="seat-form">

                <div class="form-group">

                    <label for="seat-select">
                        Available seat
                    </label>

                    <select id="seat-select"
                            required>
                    </select>

                </div>

                <!-- Modal Actions -->
                <div class="modal-actions">

                    <button class="btn btn-ghost"
                            type="button"
                            onclick="Events.closeSeatModal()">
                        Cancel
                    </button>

                    <button class="btn btn-primary"
                            type="submit">
                        Confirm registration
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="/js/api.js"></script>
    <script src="/js/events.js"></script>

</body>

</html>
